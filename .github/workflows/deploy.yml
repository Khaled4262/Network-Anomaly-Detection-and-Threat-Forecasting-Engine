# .github/workflows/deploy.yml
#
# Builds and pushes both Docker images to Docker Hub on every push to main.
# Deployment itself is pull-based: a Watchtower container running on the EC2
# instance polls Docker Hub and restarts nadtfe-backend / nadtfe-frontend
# automatically when it sees a new image -- this workflow never touches EC2
# directly, so no SSH keys or inbound security group changes are needed.

name: Build and push Docker images

on:
  push:
    branches: [main]

env:
  # Update this if the EC2 instance's public IP ever changes (shouldn't
  # happen once an Elastic IP is associated with it).
  API_BASE_URL: http://16.52.234.137:8000

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: khaled4262/nadtfe-backend:latest
          # models/ is gitignored -- see the note in DEPLOYMENT.md. This
          # workflow builds from whatever models/ contains in the runner's
          # checkout, so the runner needs it too. Simplest current fix:
          # commit the trained models/*.joblib files (they're small), or
          # add a training step here before this build step later.

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: khaled4262/nadtfe-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
